app_name: single-starter

server:
  address: ":8080"

grpc:
  address: ":9091"

log:
  level: 1
  formatter: json
  output: stdout
  buffer_size: 1024

trace:
  service_name: single-starter
  sample_ratio: 1

mysql:
  dsn: ""
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m
  conn_retry_times: 3
  conn_retry_interval: 2s
  gorm_log_level: 2

redis:
  mode: single
  addresses:
    - "127.0.0.1:6379"
  password: ""
  pool_size: 10
  min_idle_conns: 0
  idle_timeout: 5m

http_client:
  timeout: 30s
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  max_conns_per_host: 0
  idle_conn_timeout: 90s
  tls_handshake_timeout: 10s
  max_response_body_bytes: 33554432

traffic:
  rate_limit_qps: 200
  rate_limit_burst: 50

llm:
  default_provider: ""
  default_model: ""
  providers: {}
  fallbacks: []
